name: Build TomiSU APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          set -e
          ZIPFILE=$(ls *.zip 2>/dev/null | head -1)
          echo "found zip: $ZIPFILE"
          test -n "$ZIPFILE"
          mkdir -p /tmp/src
          unzip -q "$ZIPFILE" -d /tmp/src
          rm -f "$ZIPFILE"
          cp -a /tmp/src/TomiSU/. .
          rm -rf /tmp/src
          echo "=== root files ==="
          ls -la

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "=== sdk installed ok ==="
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TomiSU-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
