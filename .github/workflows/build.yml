name: Build TomiSU APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          ZIPFILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$ZIPFILE" ]; then
            echo "Unpacking $ZIPFILE"
            unzip -q "$ZIPFILE"
            shopt -s dotglob
            if [ -d TomiSU ]; then
              mv TomiSU/* .
              rmdir TomiSU
            fi
            rm -f "$ZIPFILE"
            ls -la
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools" "ndk;29.0.14206865"

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TomiSU-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
