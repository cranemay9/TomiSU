name: Build NyxSU APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          set -e
          ZIPFILE=$(ls *.zip 2>/dev/null | head -1)
          echo "found zip: $ZIPFILE"
          test -n "$ZIPFILE"
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q "$ZIPFILE" -d /tmp/src
          rm -f "$ZIPFILE"
          SRC=$(find /tmp/src -maxdepth 1 -mindepth 1 -type d | head -1)
          echo "src dir: $SRC"
          test -n "$SRC"
          cp -a "$SRC"/. .
          rm -rf /tmp/src
          echo "=== root files ==="
          ls -la

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;29.0.14206865"
          echo "=== sdk installed ok ==="
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build latest ksud (arm64, same commit as manager)
        run: |
          set -e
          git clone --depth 1 https://github.com/tiann/KernelSU.git /tmp/ksu-src
          cd /tmp/ksu-src/userspace/ksud
          rustup target add aarch64-linux-android
          export TOOLCHAIN="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export RUSTFLAGS="-C linker=$TOOLCHAIN/aarch64-linux-android31-clang"
          cargo build --release --target aarch64-linux-android
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp target/aarch64-linux-android/release/ksud "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libksud.so"
          echo "=== ksud built ==="
          ls -la "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NyxSU-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
